[package]
name = "maystock_kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Deterministic trading kernel for MayStock: indicators, strategy DSL, backtest engine."
license = "MIT"

[lib]
name = "maystock_kernel"
# staticlib is what Swift links against; rlib keeps `cargo test` working.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Market calendars need a real time zone: NYSE opens at 09:30 New York, which is
# 13:30 or 14:30 UTC depending on the date, and the holiday rules are stated in
# local dates. Hand-rolling US daylight-saving transitions would be one more
# thing to get subtly wrong for data that reaches back to 1985.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
