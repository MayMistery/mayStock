[package]
name = "maystock_kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Deterministic trading kernel for MayStock: indicators, strategy DSL, backtest engine."
license = "MIT"

[lib]
name = "maystock_kernel"
# staticlib is what Swift links against; rlib keeps `cargo test` working.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
