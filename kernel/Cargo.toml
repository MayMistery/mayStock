[package]
name = "maystock_kernel"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Trading kernel for MayStock: indicators, strategy DSL, backtest engine, and the live data layer."
license = "MIT"

[lib]
name = "maystock_kernel"
# staticlib is what Swift links against; rlib keeps `cargo test` working.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Market calendars need a real time zone: NYSE opens at 09:30 New York, which is
# 13:30 or 14:30 UTC depending on the date, and the holiday rules are stated in
# local dates. Hand-rolling US daylight-saving transitions would be one more
# thing to get subtly wrong for data that reaches back to 1985.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# The live module (`src/live`) is the one part of the kernel that does I/O: it
# holds the real-time market and account connections and feeds them into the
# same pure functions everything else uses. Native TLS (Security.framework)
# rather than a bundled root store, so the process trusts exactly what the
# system trusts, as URLSession did before.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "process"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
toml = "0.8"
# Full double-precision erf/erfc. The Abramowitz–Stegun approximation the
# kernel used carries 1.5e-7 of absolute error, enough to push a far-tail
# cumulative probability past 1 and report a range as negative.
libm = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Never strip. The release profile's default (`strip = "debuginfo"`) runs the
# system `strip` over every artifact — including the proc-macro dylibs
# (serde_derive) that rustc itself must dlopen to compile the next crate — and
# on macOS 27 the stripped dylib is refused by dyld with "mis-aligned LINKEDIT
# string pool", which fails the whole build inside `serde`. Nothing here is
# shipped as a dylib: Swift links the static library, so there is nothing to
# gain from stripping and a toolchain that cannot compile to lose.
strip = "none"
