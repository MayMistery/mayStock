[package]
name = "maystock_kernel"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Deterministic trading kernel for MayStock: indicators, strategy DSL, backtest engine."
license = "MIT"

[lib]
name = "maystock_kernel"
# staticlib is what Swift links against; rlib keeps `cargo test` working.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Never strip. The release profile's default (`strip = "debuginfo"`) runs the
# system `strip` over every artifact — including the proc-macro dylibs
# (serde_derive) that rustc itself must dlopen to compile the next crate — and
# on macOS 27 the stripped dylib is refused by dyld with "mis-aligned LINKEDIT
# string pool", which fails the whole build inside `serde`. Nothing here is
# shipped as a dylib: Swift links the static library, so there is nothing to
# gain from stripping and a toolchain that cannot compile to lose.
strip = "none"
